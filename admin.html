<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Official Cars Admin</title><style>body{font-family:Inter,Arial;margin:0;background:#f4f8fd;color:#07111f}.wrap{max-width:1100px;margin:40px auto;padding:20px}.box{background:#fff;border:1px solid #dce6f2;border-radius:18px;padding:22px;margin:15px 0}input,textarea,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #ccd8e5}input{width:100%;box-sizing:border-box}button{background:#2477ff;color:#fff;border:0;font-weight:700;cursor:pointer}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}.ok{color:#08783e}.err{color:#b42318}pre{white-space:pre-wrap;max-height:500px;overflow:auto;background:#07111f;color:#dbeafe;padding:15px;border-radius:12px}h1{font-size:38px}</style><div class="wrap"><h1>⚡ Official Cars Admin</h1><div id="login" class="box"><h2>Admin login</h2><input id="pw" type="password" placeholder="ADMIN_SECRET"><br><br><button onclick="login()">Sign in</button><p id="msg"></p></div><div id="panel" style="display:none"><div class="box"><h2>Inventory</h2><div class="row"><button onclick="loadData()">Refresh</button><button onclick="exportData()">Download JSON backup</button></div><p id="status"></p><textarea id="json" rows="25"></textarea><br><br><div class="row"><button onclick="save()">Save JSON</button><label>Import JSON file <input id="file" type="file" accept=".json" onchange="imp(event)"></label></div></div></div></div><script>let token='';const base=location.origin;async function login(){let r=await fetch(base+'/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.querySelector('#pw').value})});let d=await r.json();if(!r.ok)return msg(d.error,'err');token=d.token;sessionStorage.token=token;document.querySelector('#login').style.display='none';document.querySelector('#panel').style.display='block';loadData()}function msg(t,c='ok'){let e=document.querySelector('#msg');e.textContent=t;e.className=c}async function loadData(){let r=await fetch(base+'/api/admin/data',{headers:{Authorization:'Bearer '+token}});let d=await r.json();document.querySelector('#json').value=JSON.stringify(d,null,2);document.querySelector('#status').textContent=`${d.vehicles.length} vehicles • ${d.dealers.length} dealers`}async function save(){let body;try{body=JSON.parse(document.querySelector('#json').value)}catch(e){return alert('Invalid JSON')};let r=await fetch(base+'/api/admin/data',{method:'PUT',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(body)});let d=await r.json();alert(r.ok?'Saved!':d.error);if(r.ok)loadData()}async function exportData(){let r=await fetch(base+'/api/admin/export',{headers:{Authorization:'Bearer '+token}});let b=await r.blob();let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='official-cars-backup.json';a.click()}async function imp(e){let f=e.target.files[0];let d=JSON.parse(await f.text());let r=await fetch(base+'/api/admin/import-json',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(d)});alert((await r.json()).ok?'Imported!':'Import failed');loadData()}</script>
