services:
  - type: web
    name: official-cars-v2
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ADMIN_SECRET
        sync: false
      - key: ANALYTICS_SALT
        sync: false
      # --- Optional: GitHub-backed persistence so inventory + analytics survive redeploys ---
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: GITHUB_BRANCH
        sync: false
      - key: GITHUB_DATA_PATH
        sync: false
      # --- Optional: Web Push notifications for new listings ---
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
